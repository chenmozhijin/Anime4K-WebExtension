name: Test Chromium E2E Matrix

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  chromium-e2e-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Chromium site matrix
        run: npm run test:e2e:chromium:matrix

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-matrix-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
