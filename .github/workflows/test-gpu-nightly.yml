name: WebGPU Nightly Smoke

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  webgpu-nightly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run WebGPU smoke tests
        run: npm run test:gpu:smoke

      - name: Run WebGPU benchmark smoke
        run: npm run test:gpu:benchmark

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webgpu-nightly-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
